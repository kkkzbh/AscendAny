[project]
name = "ascendany-recommendation"
version = "0.1.0"
description = "AscendAny standalone recommendation training and scoring pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyg-lib==0.6.0+pt210cu128",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "torch==2.10.0",
    "torch-cluster==1.6.3+pt210cu128",
    "torch-geometric>=2.7",
    "torch-scatter==2.1.2+pt210cu128",
    "torch-sparse==0.6.18+pt210cu128",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ascendany-recommendation = "recommendation.pipeline:main"
ascendany-recommendation-check-cuda = "recommendation.scripts.check_cuda_env:main"
ascendany-import-legacy-problem-bank = "recommendation.scripts.import_legacy_problem_bank:main"
ascendany-import-legacy-web-oj = "recommendation.scripts.import_legacy_web_oj:main"
ascendany-import-practice-problem-tags = "recommendation.scripts.import_practice_problem_tags:main"

[tool.uv]
torch-backend = "cu128"
find-links = ["https://data.pyg.org/whl/torch-2.10.0+cu128.html"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pyg-pt210-cu128"
url = "https://data.pyg.org/whl/torch-2.10.0+cu128.html"
format = "flat"
explicit = true

[tool.uv.sources]
pyg-lib = { index = "pyg-pt210-cu128" }
torch = { index = "pytorch-cu128" }
torch-cluster = { index = "pyg-pt210-cu128" }
torch-scatter = { index = "pyg-pt210-cu128" }
torch-sparse = { index = "pyg-pt210-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recommendation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
