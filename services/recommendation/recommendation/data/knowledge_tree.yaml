descriptions:
  基本概念: "基本概念帮助你理解程序运行效率、内存使用和问题分解方式，是继续学习数据结构与算法的基础。"
  时间复杂度: "时间复杂度用来估计算法随数据规模变大时运行时间增长得有多快。"
  空间复杂度: "空间复杂度用来估计算法在运行过程中额外占用的内存规模。"
  递归: "递归是把一个问题拆成更小的同类问题，并通过终止条件逐层返回结果的方法。"
  线性结构: "线性结构按顺序组织数据，适合处理前后关系明确的元素集合。"
  数组: "数组把同类型数据连续存放，适合按下标快速访问和修改。"
  多维数组: "多维数组用多个下标表示数据位置，常用于表格、棋盘和网格问题。"
  矩阵: "矩阵是二维数据结构，常用于网格状态、图像数据和动态规划表。"
  链表: "链表通过节点指针连接数据，适合频繁插入和删除但不擅长随机访问。"
  栈: "栈遵循后进先出规则，常用于括号匹配、递归模拟和状态回退。"
  单调栈: "单调栈在栈内保持有序关系，常用于快速寻找左右最近更大或更小元素。"
  队列: "队列遵循先进先出规则，适合按到达顺序处理任务或状态。"
  单调队列: "单调队列在窗口移动时维护最优值，常用于滑动窗口最大值或最小值问题。"
  字符串: "字符串处理关注字符序列的匹配、查找、分割和规律分析。"
  KMP算法: "KMP算法利用前缀信息避免重复匹配，能在线性时间内完成字符串查找。"
  树: "树用层级关系组织数据，适合表示父子结构、递归划分和优先级关系。"
  二叉树: "二叉树中每个节点最多有两个孩子，是许多树结构和递归题的基础模型。"
  树的遍历: "树的遍历规定访问节点的顺序，用来系统地读取或处理整棵树。"
  先序遍历: "先序遍历先访问根节点，再依次访问左子树和右子树。"
  中序遍历: "中序遍历先访问左子树，再访问根节点，最后访问右子树。"
  后序遍历: "后序遍历先处理子树再访问根节点，适合需要自底向上汇总结果的问题。"
  层次遍历: "层次遍历按从上到下、从左到右的顺序逐层访问树节点。"
  森林: "森林由多棵互不相交的树组成，常用于表示多个独立层级结构。"
  哈夫曼树: "哈夫曼树通过更短编码表示高频元素，常用于最优前缀编码问题。"
  堆: "堆是一种保持局部最值性质的树形结构，适合快速获取最大值或最小值。"
  模拟: "模拟题要求按题意完整复现过程，重点在状态设计和边界处理。"
  基础模拟: "基础模拟侧重把规则直接转成代码，考察读题准确性和流程控制。"
  高级模拟: "高级模拟通常状态更多、规则更复杂，需要更清晰的数据组织和过程拆分。"
  搜索: "搜索通过枚举状态并按规则扩展，常用于寻找可行方案或最优路径。"
  DFS: "DFS沿一条路径尽可能深入探索，适合回溯、连通性和树形递归问题。"
  BFS: "BFS按层扩展状态，适合求无权图或等代价状态空间中的最短步数。"
  双向BFS: "双向BFS从起点和终点同时扩展，能减少状态空间并加快搜索。"
  图: "图由点和边组成，用来表示对象之间的连接、依赖或路径关系。"
  邻接矩阵: "邻接矩阵用二维表记录点之间是否有边，适合点数较少且查询频繁的图。"
  邻接表: "邻接表只存每个点连出的边，适合边数相对较少的图。"
  最短路: "最短路研究从一个点到另一个点的最小代价路径。"
  Dijkstra: "Dijkstra算法适用于边权非负的最短路问题，按当前最小距离逐步确定答案。"
  SPFA: "SPFA用队列松弛边，常用于含负权但无负环的最短路场景。"
  Floyd: "Floyd算法用动态规划求任意两点之间的最短路，适合点数较少的图。"
  拓扑排序: "拓扑排序把有向无环图中的任务按依赖先后排成可执行顺序。"
  最小生成树: "最小生成树在连通所有点的前提下选择总边权最小的一组边。"
  Kruskal: "Kruskal算法按边权从小到大选边，并用并查集避免形成环。"
  Prim: "Prim算法从一个点出发不断加入离当前集合最近的新点来构造最小生成树。"
  数据结构: "数据结构关注如何组织和维护数据，以便更高效地查询、更新和计算。"
  线段树: "线段树把区间递归拆分，适合处理区间查询和区间修改。"
  对顶堆: "对顶堆用两个堆维护较小部分和较大部分，常用于动态中位数问题。"
  STL: "STL提供常用容器和算法，能帮助你更快实现排序、查找和数据维护。"
  平衡树: "平衡树在动态插入和删除时保持有序结构，支持高效查找排名和前驱后继。"
  并查集: "并查集用于维护元素所属集合，能快速合并集合并判断连通关系。"
  算法: "算法是解决问题的通用策略，帮助你把题目转化为可执行的步骤。"
  贪心: "贪心每一步选择当前看起来最优的方案，适合能证明局部最优推出整体最优的问题。"
  动态规划: "动态规划把问题拆成有重叠的子问题，并保存子问题答案来避免重复计算。"
  二分: "二分通过不断缩小有序或单调范围，快速定位目标值或临界答案。"
  双指针: "双指针用两个位置协同移动，常用于数组和字符串中的区间或配对问题。"
  前缀和: "前缀和预先记录累计值，能把区间求和快速转化为两次查询。"
  差分: "差分记录相邻变化量，适合把多次区间修改转化为少量端点操作。"

