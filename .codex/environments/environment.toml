version = 1
name = "AscendAny"

[setup]
script = ""

[[actions]]
name = "启动本地客户端"
icon = "run"
command = '''bash -lc '
set -euo pipefail

for tool in pnpm curl ssh; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "[AscendAny] Missing command: $tool" >&2
    exit 1
  fi
done

if [ ! -d node_modules ] || [ ! -d apps/desktop/node_modules ]; then
  echo "[AscendAny] Node dependencies missing. Run: pnpm install" >&2
  exit 1
fi

api_host="127.0.0.1"
api_port="${ASCENDANY_DESKTOP_API_PORT:-8000}"
api_url="http://${api_host}:${api_port}"
api_health="${api_url}/readyz"
desktop_host="127.0.0.1"
desktop_port="5173"
desktop_origin="http://${desktop_host}:${desktop_port}"
tunnel_pid=""

cleanup() {
  if [ -n "${tunnel_pid:-}" ] && kill -0 "$tunnel_pid" 2>/dev/null; then
    kill "$tunnel_pid" 2>/dev/null || true
    wait "$tunnel_pid" 2>/dev/null || true
  fi
}
trap cleanup EXIT INT TERM

echo "[AscendAny] Forwarding ${api_url} to km6:127.0.0.1:18000"
ssh \
  -o BatchMode=yes \
  -o ExitOnForwardFailure=yes \
  -N \
  -L "${api_host}:${api_port}:127.0.0.1:18000" \
  km6 &
tunnel_pid=$!

echo "[AscendAny] Checking Go API through SSH tunnel: $api_health"
for _ in $(seq 1 40); do
  if curl --max-time 1 -fsS "$api_health" >/dev/null 2>&1; then
    break
  fi
  if ! kill -0 "$tunnel_pid" 2>/dev/null; then
    echo "[AscendAny] SSH tunnel exited before the API became ready" >&2
    wait "$tunnel_pid"
  fi
  sleep 0.25
done
curl --max-time 2 -fsS "$api_health" >/dev/null

echo "[AscendAny] Starting desktop at $desktop_origin against $api_url"
VITE_API_BASE_URL="$api_url" \
ASCENDANY_LINUX_GPU_MODE="${ASCENDANY_LINUX_GPU_MODE:-off}" \
ASCENDANY_LINUX_IME_MODE="${ASCENDANY_LINUX_IME_MODE:-auto}" \
pnpm --filter @ascendany/desktop dev --host "$desktop_host" --port "$desktop_port" --strictPort
'
'''

[[actions]]
name = "启动管理平台"
icon = "run"
command = '''bash -lc '
set -euo pipefail

for tool in pnpm curl; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "[AscendAny] Missing command: $tool" >&2
    exit 1
  fi
done

if [ ! -d node_modules ] || [ ! -d apps/import-console/node_modules ]; then
  echo "[AscendAny] Node dependencies missing. Run: pnpm install" >&2
  exit 1
fi

api_url="https://ascendany.kkkzbh.cn"
api_health="${api_url}/readyz"
admin_host="${ASCENDANY_ADMIN_HOST:-127.0.0.1}"
admin_port="${ASCENDANY_ADMIN_PORT:-6748}"
admin_url="http://${admin_host}:${admin_port}/"

open_admin_url() {
  target_url="${1:-$admin_url}"
  if command -v xdg-open >/dev/null 2>&1; then
    xdg-open "$target_url" >/dev/null 2>&1 || true
  elif command -v gio >/dev/null 2>&1; then
    gio open "$target_url" >/dev/null 2>&1 || true
  else
    echo "[AscendAny] Open manually: $target_url"
  fi
}

echo "[AscendAny] Checking API through Cloudflare Tunnel: $api_health"
curl --max-time 10 -fsS "$api_health" >/dev/null

if curl --max-time 2 -fsS "$admin_url" >/dev/null 2>&1; then
  echo "[AscendAny] Admin console already running at $admin_url"
  open_admin_url "$admin_url"
  exit 0
fi

echo "[AscendAny] Starting admin console at $admin_url against $api_url"
VITE_API_BASE_URL="$api_url" \
pnpm --filter @ascendany/import-console dev --host "$admin_host" --port "$admin_port" --strictPort &
web_pid=$!

for _ in $(seq 1 60); do
  if curl --max-time 2 -fsS "$admin_url" >/dev/null 2>&1; then
    break
  fi
  if ! kill -0 "$web_pid" 2>/dev/null; then
    echo "[AscendAny] Admin console exited before becoming reachable" >&2
    wait "$web_pid"
  fi
  sleep 1
done

if ! curl --max-time 2 -fsS "$admin_url" >/dev/null 2>&1; then
  echo "[AscendAny] Admin console did not become reachable: $admin_url" >&2
  exit 1
fi

echo "[AscendAny] Opening $admin_url"
open_admin_url "$admin_url"
wait "$web_pid"
'
'''

[[actions]]
name = "打开 Agent Web 端"
icon = "run"
command = '''bash -lc '
set -euo pipefail

for tool in curl; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "[AscendAny] Missing command: $tool" >&2
    exit 1
  fi
done

api_url="https://ascendany.kkkzbh.cn"
api_health="${api_url}/readyz"
web_url="${api_url}/app/"

open_web_url() {
  target_url="${1:-$web_url}"
  if command -v xdg-open >/dev/null 2>&1; then
    xdg-open "$target_url" >/dev/null 2>&1 || true
  elif command -v gio >/dev/null 2>&1; then
    gio open "$target_url" >/dev/null 2>&1 || true
  else
    echo "[AscendAny] Open manually: $target_url"
  fi
}

echo "[AscendAny] Checking API through Cloudflare Tunnel: $api_health"
curl --max-time 10 -fsS "$api_health" >/dev/null

echo "[AscendAny] Opening the Agent frontend at $web_url"
open_web_url "$web_url"
'
'''

[[actions]]
name = "启动本地 Go API 联调"
icon = "debug"
command = '''bash -lc '
set -euo pipefail

for tool in go curl ss; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "[AscendAny] Missing command: $tool" >&2
    exit 1
  fi
done

if [ ! -f backend/go.mod ]; then
  echo "[AscendAny] Missing backend/go.mod" >&2
  exit 1
fi

if ! ss -H -ltn "sport = :6432" | grep -q .; then
  echo "[AscendAny] Missing km6 PgBouncer tunnel on local port 6432." >&2
  echo "[AscendAny] Start it in another terminal: ssh -N -L 6432:127.0.0.1:6432 km6" >&2
  exit 1
fi

api_host="${ASCENDANY_LOCAL_API_HOST:-127.0.0.1}"
api_port="${ASCENDANY_LOCAL_API_PORT:-8080}"
api_url="http://${api_host}:${api_port}"
api_health="${api_url}/readyz"

if curl --max-time 2 -fsS "$api_health" >/dev/null 2>&1; then
  echo "[AscendAny] Local API already healthy at $api_health"
  exit 0
fi

echo "[AscendAny] Starting local API at $api_url with km6 DB tunnel on 127.0.0.1:6432"
ASCENDANY_HTTP_LISTEN="${api_host}:${api_port}" \
go -C backend run ./cmd/ascendanyd serve
'
'''
