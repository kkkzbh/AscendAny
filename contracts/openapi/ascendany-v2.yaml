    post:
      operationId: createAgentNote
      summary: Create the first immutable revision of one student-owned note.
      description: >-
        Requires an active student access token and enabled writes. mutationId
        is unique within the authenticated account and expectedHeadRevision
        must be zero. Exact replay returns the existing owned note with
        idempotent=true; reuse with changed canonical input is rejected. Title
        and content must already be NFC UTF-8, content must use LF line endings,
        and limits are measured in UTF-8 bytes.
