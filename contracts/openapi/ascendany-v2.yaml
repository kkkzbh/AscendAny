openapi: 3.1.0
info:
  title: AscendAny v2 API
  version: 0.22.0
  description: Authoritative public contract for the Go-only AscendAny v2 runtime.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Check process liveness.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
        "400":
          $ref: "#/components/responses/BadRequest"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check runtime and database readiness.
      security: []
      responses:
        "200":
          description: Runtime and database schema are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Runtime cannot safely serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "400":
          $ref: "#/components/responses/BadRequest"
  /version:
    get:
      operationId: getVersion
      summary: Read immutable build identity.
      security: []
      responses:
        "200":
          description: Immutable build identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v2/capabilities:
    get:
      operationId: getCapabilities
      summary: Read active upload contracts and hard limits.
      security: []
      responses:
        "200":
          description: Exact upload contract and active hard limits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v2/auth/login:
    post:
      operationId: loginAccount
      summary: Authenticate a local account and create a refresh session.
      description: Requires the exact configured web Origin because success sets the host-only refresh cookie. The JSON body has a configured hard read deadline.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthSessionOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the one-time refresh credential and issue a new access token.
      description: Requires the exact configured web Origin and an empty request body.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/AuthSessionOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke the current session and its complete refresh-token family.
      description: Requires the exact configured web Origin and an empty request body.
      security:
        - bearerAuth: []
          refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Session was revoked and the refresh cookie was cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/auth/me:
    get:
      operationId: getCurrentAccount
      summary: Read the account bound to the active access-token session.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active account and authorization revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/account/profile:
    patch:
      operationId: updateAccountProfile
      summary: Update the display name of the authenticated account.
      description: >-
        Requires an active access token. The server authenticates the token,
        then revalidates and updates the exact account and session in one
        database transaction. The JSON body has the configured authentication
        read deadline, and query parameters are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileUpdateRequest"
      responses:
        "200":
          description: Updated authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/account/sessions:
    get:
      operationId: listAccountSessions
      summary: List the authenticated account's bounded session history.
      description: >-
        Requires an active access token. The current account and exact session
        are revalidated in the same transaction that reads at most 100 sessions.
        The current session is first. Request bodies and query parameters are rejected.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bounded session history including exactly one current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/account/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/AccountSessionId"
    delete:
      operationId: revokeAccountSession
      summary: Revoke one session and its complete refresh-token family.
      description: >-
        Requires an active access token. The target must belong to the
        authenticated account. The exact account, caller session, and target
        session are locked and revalidated in one database transaction. Request
        bodies and query parameters are rejected. Revoking the current session
        also clears this browser's refresh cookie.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session and its refresh-token family were revoked.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/feedback:
    post:
      operationId: submitAuthenticatedFeedback
      summary: Submit authenticated product feedback into the durable delivery queue.
      description: >-
        Requires an active student or admin access token and enabled writes.
        clientRequestId is the caller-generated idempotency key for the
        authenticated account. Replaying the same request returns the original
        submission with created=false; reusing the key with different content
        is rejected. Accepted feedback and its queued delivery job are committed
        atomically before the response is returned. String limits are measured
        in UTF-8 bytes and every present string must already be trimmed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatedFeedbackRequest"
      responses:
        "202":
          description: The new or idempotently replayed submission is durably queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSubmitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/auth/enrollment-claims/consume:
    post:
      operationId: consumeEnrollmentClaim
      summary: Consume a single-use enrollment credential and create a student session.
      description: >-
        Requires the exact configured web Origin because success creates a
        host-only refresh session cookie. Missing, malformed, expired, revoked,
        and previously consumed credentials all return the same public rejection.
        The JSON body has the configured authentication read deadline.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentClaimRequest"
      responses:
        "200":
          $ref: "#/components/responses/AuthSessionOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/enrollment-claims:
    post:
      operationId: issueEnrollmentClaim
      summary: Issue a single-use enrollment credential for one imported student identity.
      description: >-
        Requires an active admin access token. Username, student number, and
        actor binding are checked as one identity boundary. The plaintext
        credential is returned exactly once; only its SHA-256 digest is stored.
        The JSON body has the configured authentication read deadline.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentIssueRequest"
      responses:
        "201":
          description: Enrollment credential was issued and is returned exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedEnrollment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/enrollment-claims/{grantId}:
    parameters:
      - $ref: "#/components/parameters/EnrollmentGrantId"
    delete:
      operationId: revokeEnrollmentClaim
      summary: Revoke one unconsumed enrollment credential.
      description: >-
        Requires an active admin access token. Missing, expired, consumed, and
        already revoked grants all return the same public conflict response.
        The request body and query string must be empty.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The unconsumed enrollment credential was revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/accounts:
    get:
      operationId: listManagedAccounts
      summary: List all local accounts newest first.
      description: >-
        Requires an active admin access token. The exact admin account and
        session are revalidated in the same repeatable-read transaction used for
        the page. Pagination uses the final account ID from the preceding page.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CanonicalUUIDv4"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One newest-first account page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedAccountPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/accounts/{accountId}/state:
    parameters:
      - $ref: "#/components/parameters/ManagedAccountId"
    patch:
      operationId: setManagedAccountState
      summary: Disable or restore one local account.
      description: >-
        Requires an active admin access token and enabled writes. The caller
        account/session and target account are locked in one serializable
        transaction. Every state change increments authRevision, disabling
        revokes all sessions and refresh families, and an immutable audit event
        is appended. The active administrator cannot disable itself.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedAccountStateRequest"
      responses:
        "200":
          description: Current account state after the idempotent mutation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/students:
    get:
      operationId: listManagedStudents
      summary: List every imported student identity and current account binding.
      description: >-
        Requires an active admin access token. The page joins immutable Pintia
        actor identity, latest active-snapshot display name, optional local
        account, and the current analytics-head rating. nextCursor is an opaque
        canonical base64url token for the final student number.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One student-number-ordered imported student page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedStudentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List immutable security and administration audit events newest first.
      description: >-
        Requires an active admin access token. Pagination uses the canonical
        positive decimal ID of the final event in the preceding page. Payloads
        are bounded JSON objects and never expose stored credentials.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: "^[1-9][0-9]*$"
            maxLength: 19
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One newest-first immutable audit page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/configurations:
    get:
      operationId: listConfigurations
      summary: List immutable configuration heads in canonical key order.
      description: >-
        Requires an active admin access token. Results are ordered by
        configuration key using bytewise C collation. afterKey is the exact key
        returned as nextCursor by the preceding page. Unknown, malformed, and
        duplicated query parameters are rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConfigurationKind"
        - name: afterKey
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConfigurationKey"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One canonical key-ordered configuration page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/configurations/versions:
    post:
      operationId: createConfigurationVersion
      summary: Create and activate one immutable configuration version.
      description: >-
        Requires an active admin access token and enabled writes. The supplied
        expectedHeadRevision is a compare-and-swap boundary. The document root
        must be an object, is canonicalized before hashing, and may contain at
        most 262144 UTF-8 bytes before canonicalization. model_connection and
        feedback_delivery credentials are referenced only through credentialRef;
        credential-bearing document fields are rejected. Recommendation training
        and knowledge-catalog documents pass their exact server semantic validator
        before storage. A replay of the active
        immutable document returns idempotent=true without creating a version.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigurationVersionRequest"
      responses:
        "200":
          description: The active immutable document was replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConfigurationVersionResult"
        "201":
          description: A new immutable version was created and activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateConfigurationVersionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/model-connections/{key}/test:
    parameters:
      - $ref: "#/components/parameters/ConfigurationKey"
    post:
      operationId: testModelConnection
      summary: Test one active immutable model connection.
      description: >-
        Requires an active admin access token and enabled writes. The request
        has no body or query parameters. The server loads the active immutable
        model_connection version, resolves its credential server-side, and
        performs one bounded provider request through the same HTTPS transport
        and protocol validator used by online inference. The response contains
        configuration provenance, provider authority, model name, and latency;
        credentials and provider response bodies are never returned. This route
        is absent when writes are disabled.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The active model connection completed a valid provider round trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelConnectionProbeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/admin/recommendation/training-runs:
    post:
      operationId: queueRecommendationTrainingRun
      summary: Queue one immutable recommendation training run.
      description: >-
        Requires an active admin access token and enabled writes. The server
        revalidates the complete signed principal while atomically snapshotting
        the current succeeded analytics head, the active immutable training
