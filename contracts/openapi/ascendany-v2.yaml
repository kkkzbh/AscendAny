          description: Canonical non-negative decimal int64 event sequence without leading zeroes.
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
            maxLength: 19
      responses:
        "200":
          description: SSE stream whose id is the durable per-generation event sequence.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ExamAnalysisGenerationEvent"
              x-sse-data-schema:
                $ref: "#/components/schemas/ExamAnalysisGenerationEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/imports:
    get:
      operationId: listImportJobs
      summary: List durable Pintia import jobs newest first.
      description: >-
        Requires an active admin access token. Pagination uses the public ID of
        the last item returned by the preceding page. Unknown, malformed, and
        duplicated query parameters are rejected. A cursor that no longer
        identifies a durable job is rejected.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Public import job ID returned as nextCursor by the preceding page.
          schema:
            $ref: "#/components/schemas/CanonicalUUIDv4"
        - name: limit
          in: query
          required: false
          description: >-
            Maximum jobs returned. Omission means 20. When present, it must
            occur exactly once as a canonical decimal integer without a leading zero.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One newest-first page of durable import jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/imports/pintia:
    post:
      operationId: createPintiaImport
      summary: Stream one complete Pintia snapshot v2 into the durable import queue.
      description: Requires an active admin access token. Snapshot bytes are durable before the job is returned. The upload body has a configured hard read deadline.
      requestBody:
        required: true
        content:
          application/vnd.ascendany.pintia.snapshot.v2+json:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Artifact is durable and the idempotent job exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/imports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getImportJob
      summary: Read one durable Pintia import job.
      description: Requires an active admin access token.
      responses:
        "200":
          description: Current durable job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/imports/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: streamImportEvents
      summary: Resume the ordered durable event stream after the supplied sequence.
      description: >-
        Requires an active admin access token. Durable v2 events are retained
        permanently. Authorization is checked again before the response is
        committed and periodically while connected. Every stream has a
        configured maximum lifetime and bounded write duration; clients resume
        a closed stream with Last-Event-ID.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Canonical unsigned decimal int64 sequence without leading zeroes. Values above the durable event head are rejected.
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
            maxLength: 19
      responses:
        "200":
          description: SSE stream. Each event id is the durable per-job sequence.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ImportEvent"
              x-sse-data-schema:
                $ref: "#/components/schemas/ImportEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-ascendany_refresh
      description: >-
        Opaque rotating refresh credential. The server sets this cookie with
        HttpOnly; Secure; SameSite=None; Path=/ and enforces an exact Origin/CORS
        allowlist. The cookie has no Domain attribute and JavaScript never
        receives its value.
  headers:
    SetRefreshCookie:
      description: >-
        Sets __Host-ascendany_refresh with HttpOnly; Secure; SameSite=None;
        Path=/ and no Domain attribute. The cookie contains an opaque rotating
        refresh credential.
      schema:
        type: string
    ClearRefreshCookie:
      description: >-
        Clears __Host-ascendany_refresh with Max-Age=0; HttpOnly; Secure;
        SameSite=None; Path=/.
      schema:
        type: string
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    ExamId:
      name: examId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalPositiveInt64String"
    EnrollmentGrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    AccountSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    ManagedAccountId:
      name: accountId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    AgentNoteId:
      name: noteId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    ChatThreadId:
      name: threadId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    AgentRunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    OJProblemId:
      name: problemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    OJSubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    LSPSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUUIDv4"
    ConfigurationKey:
      name: key
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConfigurationKey"
    CSRFToken:
      name: X-AscendAny-CSRF
      in: header
      required: true
      description: Rotating double-submit token returned by the preceding auth response.
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]{43}$"
  responses:
    AgentNoteMutationOK:
      description: Current owned note after a committed or idempotently replayed state revision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentNoteMutationResult"
    AuthSessionOK:
      description: Authentication succeeded and a refresh credential was created or rotated.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetRefreshCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthSession"
    BadRequest:
      description: Request syntax or payload contract is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Forbidden:
      description: Authorization, Origin, or CSRF policy rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource does not exist within the caller's scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: The requested state transition is unavailable without revealing its prior state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    RequestTimeout:
      description: Request processing or stream setup exceeded its configured duration limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TooManyRequests:
      description: The operation exceeded its authentication/request rate limit or active SSE capacity.
      headers:
        Retry-After:
          description: Delay in seconds before the caller may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    PayloadTooLarge:
      description: Request payload exceeds the route's advertised hard byte limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    UnsupportedMediaType:
      description: Request Content-Type or Content-Encoding is unsupported by the route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    UnprocessableEntity:
      description: The active provider configuration or resolved credential violates the provider contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    BadGateway:
      description: The configured upstream provider returned an invalid or rejected response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unavailable:
      description: Writes are disabled or a required runtime dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    GatewayTimeout:
      description: The configured upstream provider exceeded its immutable request timeout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    InternalServerError:
      description: The server could not complete the request without exposing internal failure details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        password:
          type: string
          format: password
          description: Raw valid UTF-8 containing 12 to 128 bytes; whitespace is significant.
          x-min-utf8-bytes: 12
          x-max-utf8-bytes: 128
    EnrollmentIssueRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, studentNumber, expiresAt]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed valid UTF-8 containing 1 to 64 bytes and no NUL.
          x-min-utf8-bytes: 1
          x-max-utf8-bytes: 64
        studentNumber:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed valid UTF-8 containing 1 to 64 bytes and no NUL.
          x-min-utf8-bytes: 1
          x-max-utf8-bytes: 64
        expiresAt:
          type: string
          format: date-time
          description: Must be after issuance and no more than seven days after issuance.
    EnrollmentClaimRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: "#/components/schemas/EnrollmentToken"
        password:
          type: string
          format: password
          description: Raw valid UTF-8 containing 12 to 128 bytes; whitespace is significant.
          x-min-utf8-bytes: 12
          x-max-utf8-bytes: 128
    IssuedEnrollment:
      type: object
      additionalProperties: false
      required: [grant, token]
      properties:
        grant:
          $ref: "#/components/schemas/EnrollmentGrant"
        token:
          $ref: "#/components/schemas/EnrollmentToken"
    EnrollmentGrant:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - studentNumber
        - issuerAccountId
        - issuedAt
        - expiresAt
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        studentNumber:
          type: string
          minLength: 1
          maxLength: 64
        issuerAccountId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    EnrollmentToken:
      type: string
      description: Canonical unpadded base64url encoding of a 256-bit opaque secret.
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"
    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, csrfToken, account]
      properties:
        accessToken:
          type: string
          description: HS256 access JWT for the bearer Authorization header.
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
        account:
          $ref: "#/components/schemas/Account"
    Account:
      oneOf:
        - $ref: "#/components/schemas/StudentAccount"
        - $ref: "#/components/schemas/AdminAccount"
      discriminator:
        propertyName: role
        mapping:
          student: "#/components/schemas/StudentAccount"
          admin: "#/components/schemas/AdminAccount"
    AccountProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed valid UTF-8 containing 1 to 64 bytes and no NUL.
          x-min-utf8-bytes: 1
          x-max-utf8-bytes: 64
    AccountSessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountSession"
    AccountSession:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAt
        - expiresAt
        - lastSeenAt
        - revokedAt
        - revocationReason
        - current
        - active
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        revokedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        revocationReason:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        current:
          type: boolean
        active:
          type: boolean
    ManagedAccountStateRequest:
      type: object
      additionalProperties: false
      required: [disabled]
      properties:
        disabled:
          type: boolean
    ManagedAccountPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ManagedAccount"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
    ManagedAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - displayName
        - studentNumber
        - role
        - authRevision
        - disabledAt
        - createdAt
        - updatedAt
        - activeSessionCount
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        studentNumber:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 64
            - type: "null"
        role:
          type: string
          enum: [student, admin]
        authRevision:
          type: integer
          format: int64
          minimum: 1
        disabledAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeSessionCount:
          type: integer
          format: int64
          minimum: 0
    ManagedStudentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ManagedStudent"
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9_-]+$"
            - type: "null"
    ManagedStudent:
      type: object
      additionalProperties: false
      required: [studentNumber, pintiaUserId, sourceDisplayName, account, rating]
      properties:
        studentNumber:
          type: string
          minLength: 1
          maxLength: 64
        pintiaUserId:
          type: string
          minLength: 1
        sourceDisplayName:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        account:
          oneOf:
            - $ref: "#/components/schemas/ManagedStudentAccountBinding"
            - type: "null"
        rating:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: "null"
    ManagedStudentAccountBinding:
      type: object
      additionalProperties: false
      required: [id, username, displayName, disabledAt]
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        disabledAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AuditEvent"
        nextCursor:
          oneOf:
            - type: string
              pattern: "^[1-9][0-9]*$"
              maxLength: 19
            - type: "null"
    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorAccountId, actorSessionId, type, occurredAt, payload]
      properties:
        id:
          type: string
          pattern: "^[1-9][0-9]*$"
          maxLength: 19
        actorAccountId:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
        actorSessionId:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
        type:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    AgentNoteCursor:
      type: string
      minLength: 1
      maxLength: 192
      pattern: "^[A-Za-z0-9_-]+$"
      description: Opaque canonical base64url keyset cursor owned by the authenticated student.
    AgentNoteState:
      type: string
      enum: [active, archived]
    AgentNoteOperation:
      type: string
      enum: [create, replace, archive, restore]
    AgentNotePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentNoteSummary"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/AgentNoteCursor"
            - type: "null"
    AgentNoteSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - headRevision
        - state
        - title
        - contentSha256
        - currentMutationId
        - currentOperation
        - currentRevisionCreatedAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        headRevision:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/AgentNoteState"
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Trimmed, single-line NFC UTF-8 containing at most 512 bytes.
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Lowercase SHA-256 of the exact canonical UTF-8 content bytes.
        currentMutationId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        currentOperation:
          $ref: "#/components/schemas/AgentNoteOperation"
        currentRevisionCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AgentNote:
      type: object
      additionalProperties: false
      required:
        - id
        - headRevision
        - state
        - title
        - contentSha256
        - currentMutationId
        - currentOperation
        - currentRevisionCreatedAt
        - createdAt
        - updatedAt
        - content
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        headRevision:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/AgentNoteState"
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Trimmed, single-line NFC UTF-8 containing at most 512 bytes.
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        currentMutationId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        currentOperation:
          $ref: "#/components/schemas/AgentNoteOperation"
        currentRevisionCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        content:
          type: string
          maxLength: 131072
          description: NFC UTF-8 with LF line endings containing at most 131072 bytes.
    CreateAgentNoteRequest:
      type: object
      additionalProperties: false
      required: [mutationId, expectedHeadRevision, title, content]
      properties:
        mutationId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        expectedHeadRevision:
          type: integer
          format: int64
          enum: [0]
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Trimmed, single-line NFC UTF-8 containing at most 512 bytes.
        content:
          type: string
          maxLength: 131072
          description: NFC UTF-8 with LF line endings containing at most 131072 bytes.
    ReplaceAgentNoteRequest:
      type: object
      additionalProperties: false
      required: [mutationId, expectedHeadRevision, title, content]
      properties:
        mutationId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
