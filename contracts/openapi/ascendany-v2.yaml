    CanonicalPositiveInt64String:
      type: string
      minLength: 1
      maxLength: 19
      pattern: "^[1-9][0-9]*$"
    LSPSession:
      type: object
      additionalProperties: false
      required: [id, workspaceUri, webSocketPath, attachTicket, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        workspaceUri:
          type: string
          format: uri
          const: file:///workspace
        webSocketPath:
          type: string
          pattern: "^/api/v2/lsp/sessions/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/websocket$"
        attachTicket:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: >-
            High-entropy single-use WebSocket capability. Keep only in memory,
            never persist or log it, and send it once as the second requested
            WebSocket subprotocol prefixed with ascendany.lsp.ticket.
          x-sensitive: true
        expiresAt:
          type: string
          format: date-time
    LSPMessage:
      type: object
      additionalProperties: true
      description: One UTF-8 JSON-RPC 2.0 object carried in one text WebSocket message.
      x-max-utf8-bytes: 1048576
