      summary: List the authenticated student's current note heads newest first.
      description: >-
        Requires an active student access token. The server derives the owner
        from the signed principal and revalidates its account, session,
        authorization revision, role, and imported student binding in the same
        repeatable-read snapshot used for the page. cursor is the exact opaque
        nextCursor returned by the preceding page. Unknown, malformed, and
        duplicated query parameters are rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque owned-note position returned as nextCursor by the preceding page.
          schema:
            $ref: "#/components/schemas/AgentNoteCursor"
        - name: limit
          in: query
          required: false
          description: >-
            Maximum note summaries. Omission means 20. A present value must be
            one canonical decimal integer without a leading zero.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
