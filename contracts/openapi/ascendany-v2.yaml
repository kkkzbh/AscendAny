  /api/v2/lsp/sessions/{sessionId}/websocket:
    parameters:
      - $ref: "#/components/parameters/LSPSessionId"
    get:
      operationId: attachLspSession
      summary: Attach one text-only WebSocket to an owned LSP session.
      description: >-
        Available only while the server write capability is enabled; disabled
        write mode returns 503 writes_disabled before request validation.
        Requires the exact Origin used to create the session, no Authorization
        header, no query string, and exactly two offered protocols in this
        order: ascendany.lsp.v1 and ascendany.lsp.ticket.<attachTicket>. The
        server atomically consumes the ticket before upgrade and selects only
        ascendany.lsp.v1 in the response. Query or Authorization credentials
        are rejected. Each text message is one bounded JSON-RPC body; binary
        messages, duplicate JSON keys, non-workspace file URIs, excess
        messages, and sessions beyond the hard duration are rejected.
        Disconnect terminates clangd and deletes the workspace.
      security: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            pattern: "^ascendany\\.lsp\\.v1, ?ascendany\\.lsp\\.ticket\\.[A-Za-z0-9_-]{43}$"
      responses:
        "101":
          description: WebSocket upgraded with the ascendany.lsp.v1 subprotocol.
          headers:
            Sec-WebSocket-Protocol:
              description: Selected versioned LSP WebSocket protocol.
              schema:
                const: ascendany.lsp.v1
          x-websocket-message-schema:
            $ref: "#/components/schemas/LSPMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
