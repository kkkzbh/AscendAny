          type: integer
          format: int32
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorCode:
          type: string
          enum: [invalid_configuration, invalid_manifest, algorithm_mismatch, config_mismatch, invalid_dataset]
        eventHead:
          type: integer
          format: int64
          minimum: 1
    ExamAnalysisGenerationEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, payload, createdAt]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          enum: [queued, running, succeeded, superseded, failed]
        payload:
          type: object
          additionalProperties: true
          x-max-utf8-bytes: 32768
        createdAt:
          type: string
          format: date-time
    NullableCanonicalDecimal:
      oneOf:
        - type: string
          maxLength: 128
          pattern: "^(0|[1-9][0-9]*)([.][0-9]+)?$"
        - type: "null"
    ImportJob:
      type: object
      additionalProperties: false
      required:
        - id
        - artifactSha256
        - status
        - stage
        - createdAt
        - updatedAt
        - examId
        - snapshotId
        - error
      properties:
        id:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        artifactSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          type: string
          enum: [queued, running, succeeded, failed, superseded]
        stage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        examId:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
        snapshotId:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/JobError"
            - type: "null"
    ImportJobPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImportJob"
        nextCursor:
          oneOf:
            - $ref: "#/components/schemas/CanonicalUUIDv4"
            - type: "null"
    ImportEvent:
      type: object
      additionalProperties: false
      required: [sequence, type, occurredAt, payload]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    JobError:
      type: object
      additionalProperties: false
      required: [code, message, permanent]
      properties:
        code:
          type: string
        message:
          type: string
        permanent:
          type: boolean
    APIError:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          $ref: "#/components/schemas/CanonicalUUIDv4"
        details:
          type: object
          additionalProperties: true
