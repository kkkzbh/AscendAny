  /api/v2/lsp/sessions:
    post:
      operationId: createLspSession
      summary: Start one isolated bounded clangd session.
      description: >-
        Available only while the server write capability is enabled; disabled
        write mode returns 503 writes_disabled before request validation.
        Requires an active bearer token, one exact configured Origin, an empty
        body, and no query string. The response returns a high-entropy one-time
        attach ticket bound to the account, session, and exact Origin. Clients
        must keep it in memory only and consume it in the immediate WebSocket
        handshake. The worker has no network, DB client, production credential,
        or host-execution fallback.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: The per-session worker authenticated over its Unix control socket and is ready to attach.
          headers:
            Location:
              description: Canonical session resource path.
              schema:
                type: string
            Cache-Control:
              description: Prevents storage of the one-time attach capability.
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LSPSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v2/lsp/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/LSPSessionId"
    delete:
      operationId: closeLspSession
      summary: Cancel one owned LSP session and destroy its workspace.
      description: >-
        Available only while the server write capability is enabled; disabled
        write mode returns 503 writes_disabled before request validation.
        Requires an active bearer token, one exact configured Origin, an empty
        body, and no query string.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: clangd was terminated and the bounded workspace was removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "429":
