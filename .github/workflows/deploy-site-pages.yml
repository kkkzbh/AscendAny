name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "apps/site/**"
      - "image/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site-pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate latest release asset manifest
        env:
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apps/site/public

          tmp="$(mktemp)"
          status="$(curl -sS -o "$tmp" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${RELEASE_OWNER}/${RELEASE_REPO}/releases/latest")"

          if [ "$status" = "200" ]; then
            jq '{
              generated_at: (now | todateiso8601),
              tag_name,
              assets: [(.assets // [])[] | {name, browser_download_url}]
            }' "$tmp" > apps/site/public/release-assets.json
          else
            echo '{"generated_at":null,"tag_name":null,"assets":[]}' > apps/site/public/release-assets.json
            echo "No latest release manifest available (HTTP ${status})."
          fi

      - name: Build site app for Pages
        env:
          # Use root path for custom domain (e.g. site.kkkzbh.cn) so assets resolve as /assets/*
          VITE_BASE_PATH: /
        run: pnpm --filter @ascendany/site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
