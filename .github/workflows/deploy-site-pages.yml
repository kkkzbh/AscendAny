name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "apps/site/**"
      - "image/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site-pages.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate latest release asset manifest
        env:
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_REPO: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apps/site/public
          mkdir -p apps/site/public/desktop-updates
          find apps/site/public/desktop-updates -type f -delete

          tmp="$(mktemp)"
          status="$(curl -sS -o "$tmp" -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${RELEASE_OWNER}/${RELEASE_REPO}/releases/latest")"

          download_release_asset() {
            local regex="$1"
            local label="$2"
            local entry
            entry="$(jq -r --arg pattern "$regex" '
              first((.assets // [])[] | select((.name // "") | test($pattern)))
              | if . == null then "" else "\(.name)\t\(.browser_download_url // "")" end
            ' "$tmp")"

            if [ -z "$entry" ]; then
              echo "No ${label} asset found in latest release."
              return
            fi

            local name
            local url
            IFS=$'\t' read -r name url <<< "$entry"
            if [ -z "$name" ] || [ -z "$url" ]; then
              echo "Skip invalid ${label} asset metadata."
              return
            fi

            curl -fL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o "apps/site/public/desktop-updates/${name}" \
              "$url"
          }

          if [ "$status" = "200" ]; then
            jq '{
              generated_at: (now | todateiso8601),
              tag_name,
              assets: [(.assets // [])[] | {name, browser_download_url}]
            }' "$tmp" > apps/site/public/release-assets.json
            download_release_asset '^latest\.yml$' "latest.yml"
            download_release_asset '^latest-linux\.yml$' "latest-linux.yml"
            download_release_asset '^AscendAny-win-.*\.exe$' "Windows installer"
            download_release_asset '^AscendAny-win-.*\.exe\.blockmap$' "Windows blockmap"
            download_release_asset '^AscendAny-linux-.*\.rpm$' "Linux RPM"
          else
            echo '{"generated_at":null,"tag_name":null,"assets":[]}' > apps/site/public/release-assets.json
            echo "No latest release manifest available (HTTP ${status})."
          fi

      - name: Build site app for Pages
        env:
          # Use root path for custom domain (e.g. site.kkkzbh.cn) so assets resolve as /assets/*
          VITE_BASE_PATH: /
        run: pnpm --filter @ascendany/site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
