name: Release Desktop Packages

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows EXE x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve desktop version from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME#v}"
          DESKTOP_VERSION="$(RAW_TAG="$RAW_TAG" node - <<'NODE'
          const raw = process.env.RAW_TAG ?? "";
          if (!raw) {
            process.exit(2);
          }
          const m = raw.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
          if (!m) {
            process.exit(3);
          }
          const major = Number.parseInt(m[1], 10);
          const minor = Number.parseInt(m[2] ?? "0", 10);
          const patch = Number.parseInt(m[3] ?? "0", 10);
          process.stdout.write(`${major}.${minor}.${patch}`);
          NODE
          )"
          echo "DESKTOP_VERSION=${DESKTOP_VERSION}" >> "$GITHUB_ENV"
          echo "Desktop version resolved to ${DESKTOP_VERSION} from tag ${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop package version
        run: npm pkg set version="${{ env.DESKTOP_VERSION }}" --prefix apps/desktop

      - name: Build desktop package (Windows EXE x64)
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://ascendany.kkkzbh.cn' }}
        run: pnpm --filter @ascendany/desktop dist:win:x64

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Get-ChildItem -Path apps/desktop/release -Filter "AscendAny-win-*.exe" -Recurse | Copy-Item -Destination release-assets -Force
          if (-not (Get-ChildItem -Path release-assets -Filter "AscendAny-win-*.exe")) {
            throw "No Windows installer .exe artifact found in apps/desktop/release"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-exe
          path: release-assets/AscendAny-win-*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux RPM x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve desktop version from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME#v}"
          DESKTOP_VERSION="$(RAW_TAG="$RAW_TAG" node - <<'NODE'
          const raw = process.env.RAW_TAG ?? "";
          if (!raw) {
            process.exit(2);
          }
          const m = raw.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
          if (!m) {
            process.exit(3);
          }
          const major = Number.parseInt(m[1], 10);
          const minor = Number.parseInt(m[2] ?? "0", 10);
          const patch = Number.parseInt(m[3] ?? "0", 10);
          process.stdout.write(`${major}.${minor}.${patch}`);
          NODE
          )"
          echo "DESKTOP_VERSION=${DESKTOP_VERSION}" >> "$GITHUB_ENV"
          echo "Desktop version resolved to ${DESKTOP_VERSION} from tag ${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libcrypt1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop package version
        run: npm pkg set version="${{ env.DESKTOP_VERSION }}" --prefix apps/desktop

      - name: Build desktop package (Linux RPM x64)
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://ascendany.kkkzbh.cn' }}
        run: pnpm --filter @ascendany/desktop dist:linux:rpm:x64

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find apps/desktop/release -type f -name "AscendAny-linux-*.rpm" -exec cp {} release-assets/ \;
          shopt -s nullglob
          files=(release-assets/AscendAny-linux-*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .rpm artifact found in apps/desktop/release" >&2
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-rpm
          path: release-assets/AscendAny-linux-*.rpm
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Verify downloaded artifacts
        run: ls -la release-assets

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/AscendAny-win-*.exe
            release-assets/AscendAny-linux-*.rpm

  refresh-pages-manifest:
    name: Refresh Pages Release Manifest
    runs-on: ubuntu-latest
    needs:
      - publish-release
    steps:
      - name: Trigger Pages workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-site-pages.yml",
              ref: context.payload.repository.default_branch,
            });
