name: Release Client Packages

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows EXE x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve desktop version from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME#v}"
          DESKTOP_VERSION="$(RAW_TAG="$RAW_TAG" node - <<'NODE'
          const raw = process.env.RAW_TAG ?? "";
          if (!raw) {
            process.exit(2);
          }
          const m = raw.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
          if (!m) {
            process.exit(3);
          }
          const major = Number.parseInt(m[1], 10);
          const minor = Number.parseInt(m[2] ?? "0", 10);
          const patch = Number.parseInt(m[3] ?? "0", 10);
          process.stdout.write(`${major}.${minor}.${patch}`);
          NODE
          )"
          echo "DESKTOP_VERSION=${DESKTOP_VERSION}" >> "$GITHUB_ENV"
          echo "Desktop version resolved to ${DESKTOP_VERSION} from tag ${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop package version
        run: npm pkg set version="${{ env.DESKTOP_VERSION }}" --prefix apps/desktop

      - name: Build desktop package (Windows EXE x64)
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://ascendany.kkkzbh.cn' }}
        run: pnpm --filter @ascendany/desktop dist:win:x64

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Get-ChildItem -Path apps/desktop/release -Filter "AscendAny-win-*.exe" -Recurse | Copy-Item -Destination release-assets -Force
          if (-not (Get-ChildItem -Path release-assets -Filter "AscendAny-win-*.exe")) {
            throw "No Windows installer .exe artifact found in apps/desktop/release"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-exe
          path: release-assets/AscendAny-win-*.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux RPM x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve desktop version from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME#v}"
          DESKTOP_VERSION="$(RAW_TAG="$RAW_TAG" node - <<'NODE'
          const raw = process.env.RAW_TAG ?? "";
          if (!raw) {
            process.exit(2);
          }
          const m = raw.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
          if (!m) {
            process.exit(3);
          }
          const major = Number.parseInt(m[1], 10);
          const minor = Number.parseInt(m[2] ?? "0", 10);
          const patch = Number.parseInt(m[3] ?? "0", 10);
          process.stdout.write(`${major}.${minor}.${patch}`);
          NODE
          )"
          echo "DESKTOP_VERSION=${DESKTOP_VERSION}" >> "$GITHUB_ENV"
          echo "Desktop version resolved to ${DESKTOP_VERSION} from tag ${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libcrypt1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop package version
        run: npm pkg set version="${{ env.DESKTOP_VERSION }}" --prefix apps/desktop

      - name: Build desktop package (Linux RPM x64)
        env:
          VITE_API_BASE_URL: ${{ vars.DESKTOP_API_BASE_URL || 'https://ascendany.kkkzbh.cn' }}
        run: pnpm --filter @ascendany/desktop dist:linux:rpm:x64

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find apps/desktop/release -type f -name "AscendAny-linux-*.rpm" -exec cp {} release-assets/ \;
          shopt -s nullglob
          files=(release-assets/AscendAny-linux-*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .rpm artifact found in apps/desktop/release" >&2
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-rpm
          path: release-assets/AscendAny-linux-*.rpm
          if-no-files-found: error

  build-android:
    name: Build Android APK (ARM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app versions from tag
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(RAW_TAG="$RAW_TAG" node - <<'NODE'
          const raw = process.env.RAW_TAG ?? "";
          if (!raw) process.exit(2);
          const m = raw.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?$/);
          if (!m) process.exit(3);
          const major = Number.parseInt(m[1], 10);
          const minor = Number.parseInt(m[2] ?? "0", 10);
          const patch = Number.parseInt(m[3] ?? "0", 10);
          process.stdout.write(`${major}.${minor}.${patch}`);
          NODE
          )"
          APP_VERSION_CODE="$(APP_VERSION="$APP_VERSION" node - <<'NODE'
          const [major, minor, patch] = (process.env.APP_VERSION ?? "0.0.0").split(".").map((n) => Number.parseInt(n, 10) || 0);
          // Keep deterministic and monotonic for semver-ish versions.
          process.stdout.write(String(major * 10000 + minor * 100 + patch));
          NODE
          )"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${APP_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "App version resolved to ${APP_VERSION} (${APP_VERSION_CODE}) from tag ${GITHUB_REF_NAME}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Android signing material (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            keystore_path="${RUNNER_TEMP}/ascendany-upload.keystore"
            printf "%s" "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
            echo "ASCENDANY_ANDROID_SIGNING_STORE_FILE=${keystore_path}" >> "$GITHUB_ENV"
            echo "ASCENDANY_ANDROID_SIGNING_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ASCENDANY_ANDROID_SIGNING_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "ASCENDANY_ANDROID_SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using configured Android release signing key."
          else
            echo "Android signing secrets are incomplete; fallback to debug signing key."
          fi

      - name: Build Android APK (ARM)
        env:
          ASCENDANY_ANDROID_VERSION_NAME: ${{ env.APP_VERSION }}
          ASCENDANY_ANDROID_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          ASCENDANY_ANDROID_SIGNING_STORE_FILE: ${{ env.ASCENDANY_ANDROID_SIGNING_STORE_FILE }}
          ASCENDANY_ANDROID_SIGNING_STORE_PASSWORD: ${{ env.ASCENDANY_ANDROID_SIGNING_STORE_PASSWORD }}
          ASCENDANY_ANDROID_SIGNING_KEY_ALIAS: ${{ env.ASCENDANY_ANDROID_SIGNING_KEY_ALIAS }}
          ASCENDANY_ANDROID_SIGNING_KEY_PASSWORD: ${{ env.ASCENDANY_ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm --filter @ascendany/site build
          pnpm --filter @ascendany/site exec cap sync android
          cd apps/site/android
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect Android artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_dir="apps/site/android/app/build/outputs/apk/release"
          apk_path=""
          if [ -f "${apk_dir}/app-release.apk" ]; then
            apk_path="${apk_dir}/app-release.apk"
          else
            apk_path="$(find "${apk_dir}" -maxdepth 1 -type f -name '*release*.apk' ! -name '*unsigned*' | head -n 1 || true)"
          fi
          if [ -z "${apk_path}" ]; then
            apk_path="$(find "${apk_dir}" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          fi
          if [ -z "${apk_path}" ]; then
            echo "No Android APK artifact found in ${apk_dir}" >&2
            exit 1
          fi
          cp "${apk_path}" "release-assets/AscendAny-android-arm64-v7a-${APP_VERSION}.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk
          path: release-assets/AscendAny-android-*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-android
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-android-apk
          merge-multiple: true
          path: release-assets

      - name: Verify downloaded artifacts
        run: ls -la release-assets

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/AscendAny-win-*.exe
            release-assets/AscendAny-linux-*.rpm
            release-assets/AscendAny-android-*.apk

  refresh-pages-manifest:
    name: Refresh Pages Release Manifest
    runs-on: ubuntu-latest
    needs:
      - publish-release
    steps:
      - name: Trigger Pages workflow_dispatch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-site-pages.yml",
              ref: context.payload.repository.default_branch,
            });
