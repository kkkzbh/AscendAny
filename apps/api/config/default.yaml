api:
  cors_origins:
    - "*"

db:
  host: 127.0.0.1
  port: 6432
  dbname: AscendAny
  user: AscendAny
  password_env: ASCENDANY_DB_PASSWORD
  dsn: null
  pool_min_size: 2
  pool_max_size: 32
  pool_timeout_seconds: 10

dashboard:
  default_rating: 800
  default_metric: 0
  rating_history_limit: 50

llm:
  server_default:
    mode: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEFAULT_API_KEY
  request_timeout_seconds: 60

auth:
  enabled: true
  provider: internal
  signup_policy: username_password_only
  jwt_secret_env: ASCENDANY_AUTH_JWT_SECRET
  jwt_secret: ascendany-dev-insecure-secret
  access_ttl_minutes: 15
  refresh_ttl_days: 30
  password_pepper_env: ASCENDANY_AUTH_PASSWORD_PEPPER
  allow_stored_password_direct_login: false
  app01_db_config_path: null
  app01_db_config_path_env: ASCENDANY_APP01_DB_CONFIG_PATH

sso:
  enabled: false
  provider: external_app
  issuer: external_app
  audience: ascendany_web
  hs256_secret_env: ASCENDANY_SSO_EXTERNAL_APP_SECRET
  clock_skew_seconds: 15
  max_token_ttl_seconds: 60
