api:
  cors_origins:
  - '*'
db:
  host: 127.0.0.1
  port: 6432
  dbname: AscendAny
  user: AscendAny
  password_env: ASCENDANY_DB_PASSWORD
  dsn: null
  pool_min_size: 2
  pool_max_size: 32
  pool_timeout_seconds: 10
dashboard:
  default_rating: 800
  default_metric: 0
  rating_history_limit: 50
llm:
  server_default:
    mode: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    api_key_env: ASCENDANY_LLM_DEEPSEEK_API_KEY
  active_tab: deepseek
  tabs:
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: Pro/moonshotai/Kimi-K2.5
      api_key_env: ASCENDANY_LLM_SILICONFLOW_API_KEY
    openai:
      base_url: https://shell.wyzai.top/v1
      model: openai/gpt-5.4-medium-thinking
      api_key_env: ASCENDANY_LLM_OPENAI_API_KEY
    copilot:
      base_url: http://127.0.0.1:5140/api/internal/copilot/v1
      model: openai/gpt-5-mini
      api_key_env: ASCENDANY_LLM_COPILOT_API_KEY
    deepseek:
      base_url: https://api.deepseek.com
      model: deepseek-v4-flash
      api_key_env: ASCENDANY_LLM_DEEPSEEK_API_KEY
  request_timeout_seconds: 60
auth:
  enabled: true
  provider: internal
  signup_policy: username_password_only
  jwt_secret_env: ASCENDANY_AUTH_JWT_SECRET
  jwt_secret: ascendany-dev-insecure-secret
  access_ttl_minutes: 15
  refresh_ttl_days: 30
  password_pepper_env: ASCENDANY_AUTH_PASSWORD_PEPPER
  allow_stored_password_direct_login: false
  app01_db_config_path: null
  app01_db_config_path_env: ASCENDANY_APP01_DB_CONFIG_PATH
sso:
  enabled: false
  provider: external_app
  issuer: external_app
  audience: ascendany_web
  hs256_secret_env: ASCENDANY_SSO_EXTERNAL_APP_SECRET
  clock_skew_seconds: 15
  max_token_ttl_seconds: 60
