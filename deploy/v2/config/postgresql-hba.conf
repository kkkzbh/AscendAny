# AscendAny production PostgreSQL client capability routes. The bootstrap
# superuser has no password and is reachable only as the container postgres OS
# identity through the explicit pg_ident map.
local replication all reject
local all ascendany_cluster_admin peer map=ascendany_cluster_admin
local all all reject

host replication all 0.0.0.0/0 reject
host replication all ::/0 reject
host "AscendAny" "AscendAny" 10.88.0.1/32 scram-sha-256
host ascendany_v2 ascendanyd_login,ascendany_migrator_login,ascendany_backup_login 10.88.0.1/32 scram-sha-256
host postgres,ascendany_v2_restore_verify ascendany_restore_login 10.88.0.1/32 scram-sha-256
host all all 10.88.0.1/32 reject
host all all 0.0.0.0/0 reject
host all all ::/0 reject
