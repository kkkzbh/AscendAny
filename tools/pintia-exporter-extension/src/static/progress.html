<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AscendAny Pintia Export Progress</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="progress.css" />
  </head>
  <body>
    <main class="progress-shell">
      <header>
        <div class="title">AscendAny</div>
        <div class="subtitle">Pintia Snapshot v2 Exporter</div>
      </header>
      <section id="status" class="status">Starting</section>
      <div class="progress-meta" id="progressText">Preparing export</div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="4">
        <div id="progressFill"></div>
      </div>
      <div class="action-row">
        <button id="retryButton" type="button" hidden>Resume from Checkpoint</button>
        <button id="restartButton" type="button" hidden>Restart Export</button>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </main>
    <script src="progress.js"></script>
  </body>
</html>
