practice_root: practice

db:
  host: 127.0.0.1
  port: 6432
  dbname: AscendAny
  user: AscendAny
  password_env: ASCENDANY_DB_PASSWORD
  dsn: null

ingest:
  encodings:
    - utf-8
    - utf-8-sig
    - gb18030
  fingerprint_roles:
    - ascendany_pintia_unit_json
  timezone: Asia/Shanghai

metrics:
  winsor_low: 0.05
  winsor_high: 0.95
  flexibility_mode_default: approx
  included_problem_kinds:
    - 函数题
    - 编程题
  random_exam_missing_drawn_set_policy: max_passed_fill_unanswered
  random_exam_slot_source_priority:
    - html_pool_choose_k
    - max_passed_count

mapping:
  primary_keys:
    - student_no
    - name
  actor_sources:
    - pintia_student_no
    - pintia_user_id
    - datastructure_nickname
    - pta_*_account
  strict_mode: true
  auto_bind_on_ingest: true
  claim_identity_source: pta_nickname

fusion:
  half_life_days:
    knowledge: 45
    accuracy: 21
    quality: 45
    flexibility: 21
    proficiency: 21

rating:
  initial_rating: 800
  max_binary_search_rating: 8000
  min_binary_search_rating: -2000
  binary_search_steps: 30

warmup:
  enabled: false
  api_base_url: null
  token_env: ASCENDANY_AUTO_ANALYSIS_PREWARM_TOKEN
  timeout_seconds: 30
  role_id: xiaoD
